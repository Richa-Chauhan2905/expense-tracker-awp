<!doctype html>
<html lang="en" ng-app="expenseApp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenzo - Auth</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>

    <style>
      /* Premium Dark Theme - Not Black */
      body {
        background: linear-gradient(135deg, #1a2639 0%, #0f172a 100%);
        color: #e2e8f0;
        min-height: 100vh;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }

      /* Logo styling */
      .logo-container {
        padding: 1rem 2rem;
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(100, 116, 139, 0.2);
      }

      .logo {
        height: 45px;
        width: auto;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
      }

      /* Card styling - Deep slate blue instead of black */
      .card-dark {
        background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
        border: 1px solid rgba(56, 189, 248, 0.15);
        color: #e2e8f0;
        backdrop-filter: blur(10px);
        box-shadow:
          0 25px 40px -12px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(56, 189, 248, 0.1) inset;
      }

      /* Form controls - Navy blue tint */
      .form-control,
      .form-select {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(56, 189, 248, 0.2);
        color: #f1f5f9;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
      }

      .form-control:focus,
      .form-select:focus {
        background: rgba(30, 41, 59, 0.9);
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        color: #ffffff;
      }

      .form-control::placeholder {
        color: rgba(148, 163, 184, 0.5);
        font-weight: 300;
      }

      .form-label {
        color: #94a3b8;
        font-weight: 500;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.5rem;
      }

      /* Pop color button - Electric blue */
      .btn-primary {
        background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
        border: none;
        color: white;
        font-weight: 600;
        padding: 0.75rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        font-size: 0.9rem;
        border-radius: 8px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      }

      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Links with pop color */
      .link-primary {
        color: #38bdf8 !important;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.2s ease;
        position: relative;
      }

      .link-primary:hover {
        color: #7dd3fc !important;
        text-decoration: none;
        border-bottom: 1px solid #38bdf8;
      }

      /* Alerts styling */
      .alert {
        border: none;
        border-radius: 10px;
        padding: 1rem;
        font-weight: 500;
        backdrop-filter: blur(10px);
      }

      .alert-danger {
        background: rgba(239, 68, 68, 0.15);
        border-left: 4px solid #ef4444;
        color: #fecaca;
      }

      .alert-success {
        background: rgba(16, 185, 129, 0.15);
        border-left: 4px solid #10b981;
        color: #a7f3d0;
      }

      /* Card header styling */
      .card .d-flex {
        border-bottom: 1px solid rgba(56, 189, 248, 0.1);
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
      }

      .card h3 {
        font-weight: 700;
        background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 1.8rem;
      }

      /* Input group enhancements */
      .mb-3 {
        position: relative;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .container {
          padding-left: 1rem;
          padding-right: 1rem;
        }

        .card {
          border-radius: 20px !important;
        }
      }

      /* Smooth transitions */
      * {
        transition:
          background-color 0.3s ease,
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #1e293b;
      }

      ::-webkit-scrollbar-thumb {
        background: #38bdf8;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #2563eb;
      }
    </style>
  </head>

  <body ng-controller="AuthController as vm">
    <!-- External Header with Logo -->
    <div class="logo-container">
      <img
        src="logo.png"
        alt="Expenzo"
        class="logo"
        onerror="this.style.display = 'none'"
      />
    </div>
    <div ng-include="'partials/header.html'"></div>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-6">
          <div class="card card-dark shadow-lg p-4 rounded-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <h3 class="m-0">{{ vm.isLogin ? 'Login' : 'Sign Up' }}</h3>
              <!-- Removed the toggle button from here -->
            </div>

            <!-- Alerts -->
            <div class="alert alert-danger" ng-if="vm.error">
              <i class="fas fa-exclamation-circle me-2"></i>{{ vm.error }}
            </div>
            <div class="alert alert-success" ng-if="vm.success">
              <i class="fas fa-check-circle me-2"></i>{{ vm.success }}
            </div>

            <!-- LOGIN FORM -->
            <form
              ng-if="vm.isLogin"
              name="loginForm"
              novalidate
              ng-submit="vm.login()"
            >
              <div class="mb-3">
                <label class="form-label">
                  <i class="fas fa-envelope me-2"></i>Email *
                </label>
                <input
                  type="email"
                  class="form-control"
                  placeholder="you@example.com"
                  ng-model="vm.loginData.email"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">
                  <i class="fas fa-lock me-2"></i>Password *
                </label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Enter password"
                  ng-model="vm.loginData.password"
                  required
                />
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100"
                ng-disabled="loginForm.$invalid || vm.isLoading"
              >
                <span ng-if="!vm.isLoading"
                  ><i class="fas fa-sign-in-alt me-2"></i>Login</span
                >
                <span ng-if="vm.isLoading">
                  <i class="fas fa-spinner fa-spin me-2"></i>Logging in...
                </span>
              </button>

              <p class="text-center mt-3 mb-0">
                New here?
                <a href="" class="link-primary" ng-click="vm.setMode(false)">
                  Create an account <i class="fas fa-arrow-right ms-1"></i>
                </a>
              </p>
            </form>

            <!-- SIGNUP FORM -->
            <form
              ng-if="!vm.isLogin"
              name="signupForm"
              novalidate
              ng-submit="vm.signup()"
            >
              <div class="mb-3">
                <label class="form-label">
                  <i class="fas fa-user me-2"></i>Full Name *
                </label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Your name"
                  ng-model="vm.signupData.fullName"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">
                  <i class="fas fa-envelope me-2"></i>Email *
                </label>
                <input
                  type="email"
                  class="form-control"
                  placeholder="you@example.com"
                  ng-model="vm.signupData.email"
                  required
                />
              </div>

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-phone me-2"></i>Phone (optional)
                  </label>
                  <input
                    type="tel"
                    class="form-control"
                    placeholder="10-digit phone"
                    ng-model="vm.signupData.phone"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-coins me-2"></i>Currency
                  </label>
                  <select
                    class="form-select"
                    ng-model="vm.signupData.currencyPreference"
                    ng-options="c for c in vm.currencies"
                  ></select>
                </div>
              </div>

              <div class="row g-3 mt-1">
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-city me-2"></i>City (optional)
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="City"
                    ng-model="vm.signupData.city"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-map me-2"></i>State (optional)
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="State"
                    ng-model="vm.signupData.state"
                  />
                </div>
              </div>

              <div class="row g-3 mt-1">
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-lock me-2"></i>Password *
                  </label>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Min 6 characters"
                    ng-model="vm.signupData.password"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-check-circle me-2"></i>Confirm Password *
                  </label>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Re-enter password"
                    ng-model="vm.signupData.confirmPassword"
                    required
                  />
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 mt-3"
                ng-disabled="signupForm.$invalid"
              >
                <i class="fas fa-user-plus me-2"></i>Create Account
              </button>

              <p class="text-center mt-3 mb-0">
                Already have an account?
                <a href="" class="link-primary" ng-click="vm.setMode(true)">
                  <i class="fas fa-sign-in-alt me-1"></i>Login
                </a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- External Footer -->
    <div ng-include="'partials/footer.html'"></div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AngularJS App Script -->
    <script src="app.js"></script>
  </body>
</html>
