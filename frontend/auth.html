<!doctype html>
<html lang="en" ng-app="expenseApp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenzo - Auth</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0c0f15;
        color: #e9edf2;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        min-height: 100vh;
      }

      .logo-container {
        padding: 1rem 2rem;
        background: rgba(12, 15, 21, 0.85);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .logo {
        height: 42px;
        width: auto;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      }

      .card-dark {
        background: rgba(20, 24, 32, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 32px;
        box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.6);
        transition: border-color 0.2s;
      }

      .card-dark:hover {
        border-color: rgba(245, 158, 11, 0.25);
      }

      .card .d-flex {
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
      }

      .card h3 {
        font-weight: 600;
        background: linear-gradient(135deg, #f0f3fa 0%, #cbd5e6 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 1.8rem;
        letter-spacing: -0.3px;
      }

      .form-control,
      .form-select {
        background: #10141c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #e9edf2;
        border-radius: 16px;
        padding: 0.75rem 1rem;
        transition: all 0.2s;
        font-size: 0.95rem;
      }

      .form-control:focus,
      .form-select:focus {
        background: #12161f;
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        color: #ffffff;
        outline: none;
      }

      .form-control::placeholder {
        color: rgba(148, 163, 184, 0.5);
      }

      .form-label {
        color: #9aa5bf;
        font-weight: 500;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.5rem;
      }

      .btn-primary {
        background: #f59e0b;
        border: none;
        color: #0c0f15;
        font-weight: 600;
        padding: 0.75rem;
        border-radius: 40px;
        font-size: 0.9rem;
        letter-spacing: 0.3px;
        transition: all 0.2s;
        box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
      }

      .btn-primary:hover:not(:disabled) {
        background: #e68a00;
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .link-primary {
        color: #f59e0b !important;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s;
      }

      .link-primary:hover {
        color: #ffb347 !important;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .alert {
        border-radius: 20px;
        padding: 1rem;
        backdrop-filter: blur(4px);
        font-weight: 500;
        border-left-width: 4px;
        border-left-style: solid;
      }

      .alert-danger {
        background: rgba(220, 38, 38, 0.1);
        border-left-color: #dc2626;
        color: #fecaca;
      }

      .alert-success {
        background: rgba(16, 185, 129, 0.1);
        border-left-color: #10b981;
        color: #a7f3d0;
      }

      .mb-3 {
        margin-bottom: 1.2rem;
      }

      @media (max-width: 768px) {
        .container {
          padding-left: 1rem;
          padding-right: 1rem;
        }

        .card-dark {
          border-radius: 24px;
        }

        .card h3 {
          font-size: 1.5rem;
        }

        .logo-container {
          padding: 0.8rem 1rem;
        }
      }

      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: #10141c;
      }

      ::-webkit-scrollbar-thumb {
        background: #3b4252;
        border-radius: 6px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #f59e0b;
      }
    </style>
  </head>

  <body ng-controller="AuthController as vm">
    <div class="logo-container">
      <img
        src="logo.png"
        alt="Expenzo"
        class="logo"
        onerror="this.style.display = 'none'"
      />
    </div>
    <div ng-include="'partials/header.html'"></div>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-6">
          <div class="card card-dark shadow-lg p-4 rounded-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <h3 class="m-0">{{ vm.isLogin ? 'Login' : 'Sign Up' }}</h3>
            </div>

            <div class="alert alert-danger" ng-if="vm.error">
              <i class="fas fa-exclamation-circle me-2"></i>{{ vm.error }}
            </div>
            <div class="alert alert-success" ng-if="vm.success">
              <i class="fas fa-check-circle me-2"></i>{{ vm.success }}
            </div>

            <form
              ng-if="vm.isLogin"
              name="loginForm"
              novalidate
              ng-submit="vm.login()"
            >
              <div class="mb-3">
                <label class="form-label">
                  <i class="fas fa-envelope me-2"></i>Email *
                </label>
                <input
                  type="email"
                  class="form-control"
                  placeholder="you@example.com"
                  ng-model="vm.loginData.email"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">
                  <i class="fas fa-lock me-2"></i>Password *
                </label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Enter password"
                  ng-model="vm.loginData.password"
                  required
                />
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100"
                ng-disabled="loginForm.$invalid || vm.isLoading"
              >
                <span ng-if="!vm.isLoading"
                  ><i class="fas fa-sign-in-alt me-2"></i>Login</span
                >
                <span ng-if="vm.isLoading">
                  <i class="fas fa-spinner fa-spin me-2"></i>Logging in...
                </span>
              </button>

              <p class="text-center mt-3 mb-0">
                New here?
                <a href="" class="link-primary" ng-click="vm.setMode(false)">
                  Create an account <i class="fas fa-arrow-right ms-1"></i>
                </a>
              </p>
            </form>

            <form
              ng-if="!vm.isLogin"
              name="signupForm"
              novalidate
              ng-submit="vm.signup()"
            >
              <div class="mb-3">
                <label class="form-label">
                  <i class="fas fa-user me-2"></i>Full Name *
                </label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Your name"
                  ng-model="vm.signupData.fullName"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">
                  <i class="fas fa-envelope me-2"></i>Email *
                </label>
                <input
                  type="email"
                  class="form-control"
                  placeholder="you@example.com"
                  ng-model="vm.signupData.email"
                  required
                />
              </div>

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-phone me-2"></i>Phone (optional)
                  </label>
                  <input
                    type="tel"
                    class="form-control"
                    placeholder="10-digit phone"
                    ng-model="vm.signupData.phone"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-coins me-2"></i>Currency
                  </label>
                  <select
                    class="form-select"
                    ng-model="vm.signupData.currencyPreference"
                    ng-options="c for c in vm.currencies"
                  ></select>
                </div>
              </div>

              <div class="row g-3 mt-1">
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-city me-2"></i>City (optional)
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="City"
                    ng-model="vm.signupData.city"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-map me-2"></i>State (optional)
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="State"
                    ng-model="vm.signupData.state"
                  />
                </div>
              </div>

              <div class="row g-3 mt-1">
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-lock me-2"></i>Password *
                  </label>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Min 6 characters"
                    ng-model="vm.signupData.password"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">
                    <i class="fas fa-check-circle me-2"></i>Confirm Password *
                  </label>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Re-enter password"
                    ng-model="vm.signupData.confirmPassword"
                    required
                  />
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 mt-3"
                ng-disabled="signupForm.$invalid"
              >
                <i class="fas fa-user-plus me-2"></i>Create Account
              </button>

              <p class="text-center mt-3 mb-0">
                Already have an account?
                <a href="" class="link-primary" ng-click="vm.setMode(true)">
                  <i class="fas fa-sign-in-alt me-1"></i>Login
                </a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div ng-include="'partials/footer.html'"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="app.js"></script>
  </body>
</html>
