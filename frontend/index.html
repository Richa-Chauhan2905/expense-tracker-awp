<!doctype html>
<html lang="en" ng-app="expenseApp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenzo – Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Dark Theme Styles -->
    <link rel="stylesheet" href="app/assets/css/theme-dark.css" />

    <!-- Chart.js (Reports Page) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- AngularJS (1.x) -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>

    <!-- UI Router -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/1.0.31/angular-ui-router.min.js"></script>
  </head>

  <body>
    <!-- Main View -->
    <div ui-view></div>

    <!-- Core App -->
    <script src="app/app.module.js"></script>
    <script src="app/app.routes.js"></script>

    <!-- Services -->
    <script src="app/core/services/api.service.js"></script>
    <script src="app/core/services/auth.service.js"></script>
    <script src="app/core/services/user.service.js"></script>
    <script src="app/core/services/expense.service.js"></script>
    <script src="app/core/services/report.service.js"></script>
    <script src="app/core/services/contact.service.js"></script>
    <script src="app/core/services/currency.service.js"></script>

    <!-- Interceptor -->
    <script src="app/core/interceptors/auth.interceptor.js"></script>

    <!-- Directives -->
    <script src="app/core/directives/fileUpload.directive.js"></script>

    <!-- Layout -->
    <script src="app/layout/header/header.directive.js"></script>
    <script src="app/layout/sidebar/sidebar.directive.js"></script>

    <!-- Pages -->
    <script src="app/pages/auth/login/login.controller.js"></script>
    <script src="app/pages/auth/signup/signup.controller.js"></script>

    <script src="app/pages/home/home.controller.js"></script>
    <script src="app/pages/manage/manage.controller.js"></script>
    <script src="app/pages/reports/reports.controller.js"></script>
    <script src="app/pages/profile/profile.controller.js"></script>
    <script src="app/pages/contact/contact.controller.js"></script>
    <script src="app/pages/logout/logout.controller.js"></script>

    <!-- Bootstrap JS (for modals, dropdowns, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
